<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apiary Manager | Dashboard</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  </head>
  <body>
    <div class="container">
      <nav class="sidebar">
        <div class="logo">🐝 MyHive</div>
        <ul>
          <li class="active">Dashboard</li>
          <li>Hives</li>
          <li>Queens</li>
          <li>Locations</li>
          <li>Inspections</li>
        </ul>
      </nav>

      <main class="content">
        <header>
          <h1>Hives</h1>
          <button id="addHiveBtn" class="btn-primary">+ Add New Hive</button>
        </header>
        <div class="options">
          <select name="sort">
            <option value="id">ID</option>
            <option value="location">Location</option>
            <option value="queen">Queen Status</option>
            <option value="box-size">Box Size</option>
          </select>
          <input id="search-box" />
        </div>
        <section class="all-hives hive-grid"></section>
      </main>
    </div>
    <div class="add_hive_overlay" style="display:none">
    <div class="add_hive_content">
        <div class="upload_image">
            <img src="../images/Pasted image.png" width=100%>
        </div>
        <div class="inputs">
                <ul>
                    <span>Name</span>
                    <input class="add_hive_input" placeholder="Leave Blank For Auto Name">
                </ul>
                <ul>
                    <span>Location</span>
                    <input list="locations" class="add_hive_input">
                    <datalist id="locations">
                    </datalist>
                </ul>
                 <ul>
                    <span>Box Size</span>
                    <input class="add_hive_input">
                </ul>
                <ul>
                    <span>Frames</span>
                    <input class="add_hive_input">
                </ul>

                 <ul>
                    <span>Date</br>Established</span>
                    <input type="date" class="add_hive_input">
                </ul>
                 <ul>
                    <span>Queen</span>
                    <input class="add_hive_input">
                </ul>                
                <ul>
                  <button class="btn-primary" id="post_hive_to_database">Add Hive</button>
                </ul>
        </div>
    </div>
    </div>
    <script type="module" src="hives.js"></script>
  </body>
</html>
