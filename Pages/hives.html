<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apiary Manager | Dashboard</title>
    <link rel="stylesheet" href="../Styles/style.css" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  </head>
  <body>
    <div class="container">
      <nav class="sidebar">
        <div class="logo">🐝 MyHive</div>
        <ul>
          <li class="active">Dashboard</li>
          <li>Hives</li>
          <li>Queens</li>
          <li>Locations</li>
          <li>Inspections</li>
        </ul>
      </nav>

      <main class="content">
        <header>
          <h1>Hives</h1>
          <button id="addHiveBtn" class="btn-primary">+ Add New Hive</button>
        </header>
        <div class="options">
          <select name="sort">
            <option value="id">ID</option>
            <option value="location">Location</option>
            <option value="queen">Queen Status</option>
            <option value="box-size">Box Size</option>
          </select>
          <input id="search-box" />
        </div>
        <section class="all-hives hive-grid"></section>
      </main>
    </div>
    <!--Add hive popup-->
    <div class="overlay" id="add-hive-overlay">
    <div class="add-hive-content">
          <button class="popup-close-btn" type="button" data-overlay="#add-hive-overlay">x</button>
          <label for="upload-image">
            <img src="../images/uploadHive.png">
            <input type="file" accept="image/*" id="upload-image">
          </label>
          <form id="post-hive-popup" class="inputs">
          <label>Name<input class="add-hive-input" placeholder="Leave Blank For Auto Name"></label>
          <label>Location<input list="locations" class="add-hive-input" required></label>
              <datalist id="locations">
              </datalist>
          <label>Box Size<input class="add-hive-input" required></label>
          <label>Frames<input class="add-hive-input" required></label>
          <label>
              <span>Date</br>Established</span>
              <input
                type="date"
                class="add-hive-input established-date"
                min="2000-01-01"
                max="2050-12-31"
                required
              >
          </label>
          <label>Queen             
              <button id="mv-queen" class="btn-primary" type="button"> Move Queen </button>
              <button id="add-queen" class="btn-primary" type="button"> Add Queen </button>
          </label>                
            <button class="btn-primary" type="submit" id="post-hive-to-database">Add Hive</button>
        </form>
    </div>
    </div>
    <!--Add queen-->
    <div class="overlay" id="add-queen-overlay">
      <form id="add-queen-popup">
        <button class="popup-close-btn" type="button" data-overlay="#add-queen-overlay">x</button>
        <label>Breed <input class="new-queen-input" placeholder="Leave Blank For Unknown"></label>
        <label>Color <input class="new-queen-input" placeholder="Leave Blank For Uncoloured"></label>
        <label>Introduction Date <input class="new-queen-input established-date" type="date" placeholder="Date Queen Was Added To Hive"></label>
        <button class="btn-primary" type="submit">Add Queen</button>
      </form>
    </div>
    <div class="overlay" id="mv-queen-overlay">
      <form id="mv-queen-popup">
        <button class="popup-close-btn" type="button" data-overlay="#mv-queen-overlay">x</button>
        <label>
          Move From Hive 
          <select id="move-queen-from">
          </select>
        </label>
        <label>
          <pre>Replace with      </pre>
          <select id="replace-with-queen">
          </select>
        </label>
        <button class="btn-primary" type="submit" >Move Queen</button>
      </form>
    </div>
    <div class="overlay" id="edit-hive-overlay">
      <form id="edit-hive-popup">
        <button class="popup-close-btn" type="button" data-overlay="#edit-hive-overlay">x</button>
        <input type="hidden" id="edit-hive-id">
        <label>Name <input class="edit-hive-input" id="edit-hive-name" required></label>
        <label>Location <input list="locations" class="edit-hive-input" id="edit-hive-location" required></label>
        <label>Box Size <input class="edit-hive-input" id="edit-hive-box-size" required></label>
        <label>Frames <input class="edit-hive-input" id="edit-hive-frames" required></label>
        <label>Last Inspection <input type="date" class="edit-hive-input established-date" id="edit-hive-last-inspection" required></label>
        <button class="btn-primary" type="submit">Save Hive</button>
      </form>
    </div>
    <script type="module" src="../Scripts/hives.js"></script>
  </body>
</html>
