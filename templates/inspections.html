<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apiary Manager | Inspections</title>
    <link rel="icon" type="image/x-icon"
      href="http://127.0.0.1:5000/static/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/inspections.css') }}" />
  </head>
  <body>
    <div class="container">

      <!-- ── Sidebar ── -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a class="logo" href="#">
            <span class="logo-icon">🐝</span>
            <span class="logo-text">MyHive</span>
          </a>
          <button id="toggle-sidebar" title="Toggle sidebar">&#9776;</button>
        </div>
        <nav>
          <ul>
            <li>
              <a href="{{ url_for('dashboard') }}">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3"
                      width="7" height="7" />
                    <rect x="14" y="14" width="7" height="7" /><rect x="3"
                      y="14" width="7" height="7" />
                  </svg>
                </span>
                <span class="nav-label">Dashboard</span>
              </a>
            </li>
            <li>
              <a href="{{ url_for('hives_page') }}">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                  </svg>
                </span>
                <span class="nav-label">Hives</span>
              </a>
            </li>
            <li>
              <a href="{{ url_for('queens_page') }}">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 18l2-10 4 4 3-6 3 6 4-4 2 10z" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                  </svg>
                </span>
                <span class="nav-label">Queens</span>
              </a>
            </li>
            <li>
              <a href="{{ url_for('locations') }}">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z" />
                    <circle cx="12" cy="10" r="3" />
                  </svg>
                </span>
                <span class="nav-label">Locations</span>
              </a>
            </li>
            <li class="active">
              <a href="{{ url_for('inspections') }}">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" />
                    <rect x="9" y="3" width="6" height="4" rx="2" />
                    <line x1="9" y1="12" x2="15" y2="12" /><line x1="9" y1="16"
                      x2="13" y2="16" />
                  </svg>
                </span>
                <span class="nav-label">Inspections</span>
              </a>
            </li>
            <li class="nav-logout">
              <a href="{{ url_for('logout') }}">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                  </svg>
                </span>
                <span class="nav-label">Log out</span>
              </a>
            </li>
          </ul>
        </nav>
        <button class="sidebar-expand" id="expand-sidebar"
          title="Expand sidebar">›</button>
      </aside>

      <!-- ── Main content ── -->
      <main class="content">
        <div id="top-bar">
          <header>
            <h1>Inspections</h1>
            <a class="btn-primary btn-secondary" href="{{ url_for('hives_page') }}">Add / manage hives</a>
          </header>

          <!-- Stats strip -->
          <div class="stats-strip" id="stats-strip">
            <div class="stat-item">
              <span class="stat-label">Total Hives</span>
              <span class="stat-value" id="stat-total">—</span>
            </div>
            <div class="stat-item stat-locations">
              <span class="stat-label">Locations</span>
              <span class="stat-value" id="stat-locations">—</span>
            </div>
            <div class="stat-item stat-queened">
              <span class="stat-label">Queened</span>
              <span class="stat-value" id="stat-queened">—</span>
            </div>
            <div class="stat-item stat-unqueened">
              <span class="stat-label">Unqueened</span>
              <span class="stat-value" id="stat-unqueened">—</span>
            </div>
          </div>

          <div class="actions-bar">
            <div class="search-wrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65"
                  y2="16.65" />
              </svg>
              <input id="search-box" placeholder="Search hives / locations…" />
            </div>
          </div>
        </div>

        <div class="page-body">
          <section class="inspections-body" id="inspections-body"></section>
        </div>
      </main>
    </div>

    <!-- Datalist used by edit popup -->
    <datalist id="locations"></datalist>

    <!-- ── Edit Hive (Inspection) Overlay ── -->
    <div class="overlay" id="edit-hive-overlay">
      <div id="edit-hive-content">
        <button class="popup-close-btn" type="button"
          data-overlay="#edit-hive-overlay">✕</button>
        <label class="image-upload-label" for="upload-image-edit-input">
          <img src id="edit-image" alt="Hive image">
          <input type="file" accept="image/*" id="upload-image-edit-input"
            class="upload-image">
        </label>
        <form id="edit-hive-popup" class="inputs">
          <input type="hidden" id="edit-hive-id">
          <input type="hidden" id="edit-image-id">
          <label>
            Name
            <input class="edit-hive-input" id="edit-hive-name" required>
          </label>
          <label>
            Location
            <input list="locations" class="edit-hive-input"
              id="edit-hive-location" required>
          </label>
          <label>
            Box Size
            <input class="edit-hive-input" id="edit-hive-box-size" type="number"
              inputmode="numeric" min="0" step="1" required>
          </label>
          <label>
            Frames
            <input class="edit-hive-input" id="edit-hive-frames" type="number"
              inputmode="numeric" min="0" step="1" required>
          </label>
          <label>
            Last Inspection
            <input type="date" class="edit-hive-input established-date"
              id="edit-hive-last-inspection" required>
          </label>

          <label class="check-row">
            <input type="checkbox" id="edit-hive-feed">
            Feed Added
          </label>

          <label class="notes-wrap">
            <div class="notes-label-row">
              Notes
              <span class="notes-counter" id="notes-counter">0/500</span>
            </div>
            <textarea id="edit-hive-notes" class="edit-hive-input" maxlength="500"
              placeholder="Inspection notes (max 500 characters)"></textarea>
          </label>

          <button class="btn-primary btn-secondary" type="submit">Save
            Changes</button>
        </form>
      </div>
    </div>

    <script type="module"
      src="{{ url_for('static', filename='js/inspections.js') }}"></script>
  </body>
</html>
