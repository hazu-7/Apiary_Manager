<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Apiary Manager | Dashboard</title>
        <link rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <div class="container">
            <nav class="sidebar">
                <div class="sidebar-header">
                    <button id="toggle-sidebar">☰</button>
                    <div class="logo">🐝 <span>MyHive</span></div>
                </div>
                <ul>
                    <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                    <li><a href="{{ url_for('hives_page') }}">Hives</a></li>
                    <li><a href="{{ url_for('queens_page') }}">Queens</a></li>
                    <li><a href="{{ url_for('locations') }}">Locations</a></li>
                    <li><a
                            href="{{ url_for('inspections') }}">Inspections</a></li>
                </ul>
            </nav>

            <main class="content">
                <header>
                    <h1>Apiary Overview</h1>
                    <button id="addHiveBtn" class="btn-primary">+ Add New
                        Hive</button>
                </header>

                <section class="stats-grid">
                    <div class="card stat-card">
                        <h3>Total Hives</h3>
                        <p id="totalHives">12</p>
                    </div>
                    <div class="card stat-card">
                        <h3>Active Queens</h3>
                        <p id="activeQueens">10</p>
                    </div>
                    <div class="card stat-card">
                        <h3>Health Alert</h3>
                        <p class="alert-text">2 Hives</p>
                    </div>
                </section>

                <section class="hive-section">
                    <h2>Recent Hive Activity</h2>
                    <div class="hive-grid" id="hiveGrid">
                    </div>
                </section>
            </main>
        </div>
        <script type="module"
            src="{{ url_for('static', filename='js/hives.js') }}"></script>
    </body>
</html>
